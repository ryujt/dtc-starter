<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>returns-policy — Return policy (/{countryCode}/returns)</title>
  <link rel="stylesheet" href="assets/store.css">
</head>
<body data-shell="main" data-cart-count="0">
  <!-- AS-IS 근거: app/[countryCode]/(main)/returns/page.tsx, modules/policies/templates(PolicyPage, PoliciesUnavailable), apps/backend/src/lib/region-store-policies.ts(DEFAULT_REGION_STORE_POLICIES) -->
  <!-- 값: return_window_days 30, free_returns false -->
  <main id="page">
    <section data-scene="default" data-scene-name="반품 정책">
      <div class="content-container py-12" style="max-width:768px;margin:0 auto"><h1 style="font-size:24px;font-weight:600;line-height:36px;margin-bottom:32px">Return policy</h1><div class="stack gap-6" style="font-size:14px"><p>You can return items within 30 days of delivery. Items are returned by mail.</p><p>Return shipping costs are paid by the customer.</p></div></div>
      <!-- free_returns=true이면 두 번째 문단이 'Return shipping is free.' -->
    </section>
    <section data-scene="unavailable" data-scene-name="정책 없음">
      <div class="content-container py-12" style="max-width:768px;margin:0 auto"><h1 style="font-size:24px;font-weight:600;line-height:36px;margin-bottom:32px">Return policy</h1><div class="stack gap-6" style="font-size:14px"><p class="subtle">Policy details for this region haven&#39;t been published yet.</p></div></div>
    </section>
  </main>
  <script src="assets/shell.js"></script>
</body>
</html>
