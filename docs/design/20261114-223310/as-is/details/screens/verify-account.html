<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>verify-account — Verify your email (/{countryCode}/verify-account?token=)</title>
  <link rel="stylesheet" href="assets/store.css">
  <style>
    /* account-layout.tsx: max-w-5xl, small:grid-cols-[240px_1fr] py-12 */
    .acct { max-width: 1024px; }
    .acct-grid { display: grid; grid-template-columns: 1fr; padding: 48px 0; }
    @media (min-width: 1024px) { .acct-grid { grid-template-columns: 240px 1fr; } }
    .acct-nav ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 16px; font-size: 14px; }
    .acct-nav a { color: var(--fg-subtle); }
    .acct-nav a.active { color: var(--fg-base); font-weight: 600; }
    .acct-nav button { background: none; border: 0; padding: 0; color: var(--fg-subtle); }
    .acct-foot { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 32px; padding: 48px 0; border-top: 1px solid var(--border); }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--fg-base); border-radius: 50%; }
    .h2xl { font-size: 24px; font-weight: 600; line-height: 36px; }
    .lg-semi { font-size: 18px; font-weight: 600; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-pc { display: grid; grid-template-columns: 144px 1fr; gap: 8px; }
    .field .req { color: #f43f5e; }
  </style>
</head>
<body data-shell="main" data-cart-count="0">
  <!-- AS-IS 근거: app/[countryCode]/(main)/verify-account/page.tsx, modules/account/components/verify-account, lib/data/customer.ts(confirmEmailVerification) -->
  <main id="page">
    <section data-scene="default" data-scene-name="확인 중">
      <div class="row" style="justify-content:center;padding:48px 32px"><div class="stack gap-4" style="max-width:384px;width:100%;align-items:center;text-align:center"><h1 class="lg-semi upper">Email verification</h1><p>Verifying your email...</p></div></div>
      <!-- Suspense fallback도 같은 'Verifying your email...' 문구(제목 없이)를 표시 -->
    </section>
    <section data-scene="success" data-scene-name="인증 성공">
      <div class="row" style="justify-content:center;padding:48px 32px"><div class="stack gap-4" style="max-width:384px;width:100%;align-items:center;text-align:center"><h1 class="lg-semi upper">Email verification</h1><p>Your email is verified. You can now sign in to your account.</p><a class="btn btn-primary" href="account-login.html">Go to sign in</a></div></div>
    </section>
    <section data-scene="error" data-scene-name="링크 무효·만료">
      <div class="row" style="justify-content:center;padding:48px 32px"><div class="stack gap-4" style="max-width:384px;width:100%;align-items:center;text-align:center"><h1 class="lg-semi upper">Email verification</h1><p>This verification link is invalid or has expired. Sign in to receive a new verification email.</p><a class="btn btn-secondary" href="account-login.html">Go to sign in</a></div></div>
      <!-- token 쿼리가 없을 때도 이 상태 -->
    </section>
  </main>
  <script src="assets/shell.js"></script>
</body>
</html>
